<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Transfer Hub - Hex Patch Final</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: #00ffcc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h2 { border-bottom: 2px solid #00ffcc; padding-bottom: 5px; }
        
        .container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        .active-container { display: flex; }

        button, .direct-link {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            display: block;
        }
        
        #video-container {
            width: 100%;
            border: 2px dashed #00ffcc;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }
        video { width: 100%; display: block; }
        
        .progress-bar {
            width: 100%; background-color: #333; height: 20px; margin-top: 15px; border-radius: 5px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background-color: #00ffcc; width: 0%; border-radius: 5px; transition: width 0.1s;
        }
        
        #qr-display {
            background-color: white; padding: 15px; border-radius: 10px; margin: 20px 0; display: none;
            width: 280px; height: 280px;
        }
        input[type="file"], input[type="number"] {
            background: #1a1a1a; color: #00ffcc; border: 1px solid #00ffcc; padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 15px; border-radius: 5px;
        }
        .settings-box { border: 1px solid #333; padding: 15px; width: 100%; box-sizing: border-box; border-radius: 8px; }
        .back-btn { background-color: #ff0055; color: white; }
        
        #downloadAnchor {
            background-color: #ff00ff;
            color: #ffffff;
            font-size: 18px;
            display: none;
            margin-top: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }
    </style>
</head>
<body>

    <h2>OPTICAL HUB HEX PATCH</h2>

    <!-- Main Menu -->
    <div id="main-menu" class="container active-container">
        <button id="btnToReceive">📥 Receive File (Scan QR)</button>
        <button id="btnToSend">📤 Send File (Broadcast QR)</button>
    </div>

    <!-- RECEIVE SCREEN -->
    <div id="receive-screen" class="container">
        <button class="back-btn" id="btnBackFromReceive">← Back</button>
        <button id="startScanBtn">Start Camera</button>
        
        <div id="video-container">
            <video id="camera" autoplay playsinline></video>
        </div>
        
        <div id="scan-status" style="margin-top: 15px;">Waiting...</div>
        <div class="progress-bar"><div id="scan-progress" class="progress-fill"></div></div>
        
        <a id="downloadAnchor" class="direct-link" target="_blank">🚀 CLICK TO SAVE FILE NOW</a>

        <canvas id="canvas" hidden></canvas>
    </div>

    <!-- SEND SCREEN -->
    <div id="send-screen" class="container">
        <button class="back-btn" id="btnBackFromSend">← Back</button>
        
        <div class="settings-box">
            <label>Select File:</label>
            <input type="file" id="fileInput">
            
            <label>FPS Speed:</label>
            <input type="number" id="fpsInput" value="8" min="1" max="60">
        </div>
        
        <button id="startGenBtn">Start Broadcast</button>
        
        <div id="gen-status" style="margin-top: 10px;"></div>
        <div id="qr-display"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            function showScreen(screenId) {
                document.querySelectorAll('.container').forEach(el => el.classList.remove('active-container'));
                document.getElementById(screenId).classList.add('active-container');
            }

            document.getElementById('btnToReceive').addEventListener('click', () => showScreen('receive-screen'));
            document.getElementById('btnToSend').addEventListener('click', () => showScreen('send-screen'));
            
            document.getElementById('btnBackFromReceive').addEventListener('click', () => {
                showScreen('main-menu');
                stopScanner();
            });

            document.getElementById('btnBackFromSend').addEventListener('click', () => {
                showScreen('main-menu');
                stopGenerating();
            });

            // --- RECEIVER LOGIC ---
            let scanning = false;
            let receivedChunkBytes = {};
            let totalExpected = 0;
            let scanReceivedCount = 0;
            let scanFileName = "file";
            let totalOriginalSize = 0;
            let compiledBlobUrl = null;

            const video = document.getElementById("camera");
            const canvasElement = document.getElementById("canvas");
            const canvas = canvasElement.getContext("2d");

            document.getElementById('startScanBtn').addEventListener('click', startScanner);

            function startScanner() {
                document.getElementById('downloadAnchor').style.display = 'none';
                
                navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                }).then(stream => {
                    scanning = true;
                    document.getElementById('video-container').style.display = 'block';
                    document.getElementById('startScanBtn').style.display = 'none';
                    video.srcObject = stream;
                    requestAnimationFrame(tick);
                }).catch(err => alert("Camera access required: " + err.message));
            }

            function stopScanner() {
                scanning = false;
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                document.getElementById('video-container').style.display = 'none';
                document.getElementById('startScanBtn').style.display = 'block';
                receivedChunkBytes = {}; totalExpected = 0; scanReceivedCount = 0;
                document.getElementById('scan-progress').style.width = "0%";
                document.getElementById('scan-status').innerText = "Waiting...";
            }

            function tick() {
                if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
                    canvasElement.height = video.videoHeight;
                    canvasElement.width = video.videoWidth;
                    canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                    let imgData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                    
                    let code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "attemptBoth" });

                    if (code) {
                        processScannedData(code.data);
                    }
                }
                if (scanning) requestAnimationFrame(tick);
            }

            function processScannedData(data) {
                let parts = data.split('|');
                if (parts.length >= 4) {
                    let name = parts[0];
                    let total = parseInt(parts[1]);
                    let index = parseInt(parts[2]);
                    let origSize = parseInt(parts[3]);
                    let hexChunk = parts.slice(4).join('|');
                    
                    if (totalExpected === 0) { 
                        totalExpected = total; 
                        scanFileName = name; 
                        totalOriginalSize = origSize;
                    }
                    
                    if (!receivedChunkBytes[index]) {
                        try {
                            // Hex string ko wapas Uint8Array bytes mein convert karna (100% safe from corruption)
                            let bytePairs = hexChunk.match(/.{1,2}/g);
                            if (!bytePairs) return;
                            let bytes = new Uint8Array(bytePairs.length);
                            for (let i = 0; i < bytePairs.length; i++) {
                                bytes[i] = parseInt(bytePairs[i], 16);
                            }
                            
                            receivedChunkBytes[index] = bytes;
                            scanReceivedCount = Object.keys(receivedChunkBytes).length;
                            
                            let pct = (scanReceivedCount / totalExpected) * 100;
                            document.getElementById('scan-progress').style.width = pct + "%";
                            document.getElementById('scan-status').innerText = `Received ${scanReceivedCount}/${totalExpected} chunks`;

                            if (scanReceivedCount === totalExpected) {
                                stopScanner();
                                document.getElementById('scan-status').innerText = "All chunks received! Reassembling...";
                                assembleFile();
                            }
                        } catch (e) {
                            // Ignore corrupted frame reads
                        }
                    }
                }
            }

            function assembleFile() {
                try {
                    for (let i = 0; i < totalExpected; i++) {
                        if (!receivedChunkBytes[i]) {
                            alert("Error: Missing chunk index " + i + ". Please restart transfer.");
                            return;
                        }
                    }

                    let totalLen = 0;
                    for (let i = 0; i < totalExpected; i++) {
                        totalLen += receivedChunkBytes[i].length;
                    }
                    
                    let combined = new Uint8Array(totalLen);
                    let offset = 0;
                    for (let i = 0; i < totalExpected; i++) {
                        combined.set(receivedChunkBytes[i], offset);
                        offset += receivedChunkBytes[i].length;
                    }
                    
                    let finalBytes = combined.subarray(0, totalOriginalSize);

                    let ext = scanFileName.split('.').pop().toLowerCase();
                    let mimeType = "application/octet-stream";
                    if (ext === "pdf") mimeType = "application/pdf";
                    else if (ext === "jpg" || ext === "jpeg") mimeType = "image/jpeg";
                    else if (ext === "png") mimeType = "image/png";
                    else if (ext === "txt") mimeType = "text/plain";
                    else if (ext === "zip") mimeType = "application/zip";

                    const blob = new Blob([finalBytes], { type: mimeType });
                    if (compiledBlobUrl) URL.revokeObjectURL(compiledBlobUrl);
                    compiledBlobUrl = URL.createObjectURL(blob);
                    
                    const anchor = document.getElementById('downloadAnchor');
                    anchor.href = compiledBlobUrl;
                    anchor.download = scanFileName;
                    anchor.style.display = 'block';
                    
                    document.getElementById('scan-status').innerText = "File successfully reassembled! Tap below to download.";
                } catch (err) {
                    alert("Assembly failed: " + err.message);
                }
            }

            // --- SENDER LOGIC ---
            let genInterval;
            let qrObj = null;

            const startGenBtn = document.getElementById('startGenBtn');
            startGenBtn.addEventListener('click', () => {
                if (startGenBtn.innerText.includes("Stop")) {
                    stopGenerating();
                } else {
                    startGenerating();
                }
            });

            function startGenerating() {
                const fileInput = document.getElementById('fileInput').files[0];
                const fps = parseInt(document.getElementById('fpsInput').value) || 8;
                if (!fileInput) return alert("Select a file first.");
                
                const reader = new FileReader();
                document.getElementById('gen-status').innerText = "Processing file...";
                
                reader.onload = function(e) {
                    const arrayBuffer = e.target.result;
                    const bytes = new Uint8Array(arrayBuffer);
                    const originalSize = bytes.length;
                    
                    // Har chunk ko 80 bytes rakha hai taake Hex encoding ke sath bhi QR code asani se scan ho sakay
                    const BYTES_PER_CHUNK = 80; 
                    const qrChunks = [];
                    
                    for (let i = 0; i < originalSize; i += BYTES_PER_CHUNK) {
                        let slice = bytes.subarray(i, i + BYTES_PER_CHUNK);
                        // Raw bytes ko Hex string mein badલنا (No Base64 corruption issue)
                        let hexString = Array.from(slice).map(b => b.toString(16).padStart(2, '0')).join('');
                        qrChunks.push(hexString);
                    }
                    
                    const qrDisp = document.getElementById('qr-display');
                    qrDisp.innerHTML = "";
                    qrDisp.style.display = 'block';
                    qrObj = new QRCode(qrDisp, { width: 280, height: 280, correctLevel: QRCode.CorrectLevel.L });
                    
                    let currentIndex = 0;
                    startGenBtn.innerText = "Stop Broadcast";

                    clearInterval(genInterval);
                    genInterval = setInterval(() => {
                        let payload = `${fileInput.name}|${qrChunks.length}|${currentIndex}|${originalSize}|${qrChunks[currentIndex]}`;
                        qrObj.clear();
                        qrObj.makeCode(payload);
                        document.getElementById('gen-status').innerText = `Broadcasting: Frame ${currentIndex + 1}/${qrChunks.length}`;
                        currentIndex = (currentIndex + 1) % qrChunks.length;
                    }, 1000 / fps);
                };
                reader.readAsArrayBuffer(fileInput);
            }

            function stopGenerating() {
                clearInterval(genInterval);
                document.getElementById('qr-display').style.display = 'none';
                document.getElementById('gen-status').innerText = "Broadcast stopped.";
                startGenBtn.innerText = "Start Broadcast";
            }
        });
    </script>
</body>
</html>
