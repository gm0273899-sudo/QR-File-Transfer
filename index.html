<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Transfer Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: #00ffcc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h2 { border-bottom: 2px solid #00ffcc; padding-bottom: 5px; }
        
        .container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        .active-container { display: flex; }

        button {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
        }
        
        #video-container {
            width: 100%;
            border: 2px dashed #00ffcc;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }
        video { width: 100%; display: block; }
        
        .progress-bar {
            width: 100%; background-color: #333; height: 20px; margin-top: 15px; border-radius: 5px;
        }
        .progress-fill {
            height: 100%; background-color: #00ffcc; width: 0%; border-radius: 5px; transition: width 0.1s;
        }
        
        #qr-display {
            background-color: white; padding: 15px; border-radius: 10px; margin: 20px 0; display: none;
            width: 280px; height: 280px;
        }
        input[type="file"], input[type="number"] {
            background: #1a1a1a; color: #00ffcc; border: 1px solid #00ffcc; padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 15px; border-radius: 5px;
        }
        .settings-box { border: 1px solid #333; padding: 15px; width: 100%; box-sizing: border-box; border-radius: 8px; }
        .back-btn { background-color: #ff0055; color: white; }
        
        .download-btn { background-color: #00ffcc; color: #000; font-size: 16px; display: none; margin-top: 10px; }
        .fallback-btn { background-color: #ffcc00; color: #000; font-size: 16px; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>OPTICAL HUB</h2>

    <!-- Main Menu -->
    <div id="main-menu" class="container active-container">
        <button onclick="showScreen('receive-screen')">📥 Receive File (Scan QR)</button>
        <button onclick="showScreen('send-screen')">📤 Send File (Broadcast QR)</button>
    </div>

    <!-- RECEIVE SCREEN -->
    <div id="receive-screen" class="container">
        <button class="back-btn" onclick="showScreen('main-menu'); stopScanner();">← Back</button>
        <button id="startScanBtn" onclick="startScanner()">Start Camera</button>
        
        <div id="video-container" style="display:none;">
            <video id="camera" autoplay playsinline></video>
        </div>
        
        <div id="scan-status" style="margin-top: 15px;">Waiting...</div>
        <div class="progress-bar"><div id="scan-progress" class="progress-fill"></div></div>
        
        <!-- Two Download Options to bypass Android Bugs -->
        <button id="downloadBtn" class="download-btn" onclick="triggerDownload()">💾 Save File (Standard)</button>
        <button id="fallbackBtn" class="fallback-btn" onclick="triggerFallbackDownload()">⚠️ Save File (Fallback)</button>

        <canvas id="canvas" hidden></canvas>
    </div>

    <!-- SEND SCREEN -->
    <div id="send-screen" class="container">
        <button class="back-btn" onclick="showScreen('main-menu'); stopGenerating();">← Back</button>
        
        <div class="settings-box">
            <label>Select File:</label>
            <input type="file" id="fileInput">
            
            <label>FPS Speed:</label>
            <input type="number" id="fpsInput" value="15" min="1" max="90">
        </div>
        
        <button id="startGenBtn" onclick="startGenerating()">Start Broadcast</button>
        
        <div id="gen-status" style="margin-top: 10px;"></div>
        <div id="qr-display"></div>
    </div>

    <script>
        function showScreen(screenId) {
            document.querySelectorAll('.container').forEach(el => el.classList.remove('active-container'));
            document.getElementById(screenId).classList.add('active-container');
        }

        // --- RECEIVER LOGIC ---
        let scanning = false;
        let scanChunks = {};
        let totalExpected = 0;
        let scanReceivedCount = 0;
        let scanFileName = "file";
        let compiledBlobUrl = null;
        let fallbackDataUri = null;

        const video = document.getElementById("camera");
        const canvasElement = document.getElementById("canvas");
        const canvas = canvasElement.getContext("2d");

        function startScanner() {
            document.getElementById('downloadBtn').style.display = 'none';
            document.getElementById('fallbackBtn').style.display = 'none';
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", frameRate: { ideal: 60 } } }).then(stream => {
                scanning = true;
                document.getElementById('video-container').style.display = 'block';
                document.getElementById('startScanBtn').style.display = 'none';
                video.srcObject = stream;
                requestAnimationFrame(tick);
            }).catch(() => alert("Camera access required!"));
        }

        function stopScanner() {
            scanning = false;
            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('video-container').style.display = 'none';
            document.getElementById('startScanBtn').style.display = 'block';
            scanChunks = {}; totalExpected = 0; scanReceivedCount = 0;
            document.getElementById('scan-progress').style.width = "0%";
            document.getElementById('scan-status').innerText = "Waiting...";
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                let imgData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                let code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

                if (code) processScannedData(code.data);
            }
            if (scanning) requestAnimationFrame(tick);
        }

        function processScannedData(data) {
            let parts = data.split('|');
            if (parts.length >= 4) {
                let name = parts[0], total = parseInt(parts[1]), index = parseInt(parts[2]);
                let b64 = parts.slice(3).join('|').trim();
                
                if (totalExpected === 0) { totalExpected = total; scanFileName = name; }
                
                if (!scanChunks[index]) {
                    scanChunks[index] = b64;
                    scanReceivedCount++;
                    
                    let pct = (scanReceivedCount / totalExpected) * 100;
                    document.getElementById('scan-progress').style.width = pct + "%";
                    document.getElementById('scan-status').innerText = `Received ${scanReceivedCount}/${totalExpected}`;

                    if (scanReceivedCount === totalExpected) {
                        stopScanner();
                        document.getElementById('scan-status').innerText = "File Received! Preparing download...";
                        setTimeout(prepareDownload, 200); // 200ms delay to unfreeze UI
                    }
                }
            }
        }

        function prepareDownload() {
            try {
                let finalB64 = "";
                for (let i = 0; i < totalExpected; i++) {
                    finalB64 += scanChunks[i];
                }
                
                // Remove any empty spaces used for padding
                finalB64 = finalB64.replace(/\s/g, '');

                // 1. Detect proper MIME type from filename extension
                let ext = scanFileName.split('.').pop().toLowerCase();
                let mimeType = "application/octet-stream"; // default
                
                if (ext === "pdf") mimeType = "application/pdf";
                else if (ext === "jpg" || ext === "jpeg") mimeType = "image/jpeg";
                else if (ext === "png") mimeType = "image/png";
                else if (ext === "txt") mimeType = "text/plain";
                else if (ext === "docx") mimeType = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";

                // 2. Create standard Blob URL
                const byteCharacters = atob(finalB64);
                
                // Memory efficient array conversion
                const byteArray = new Uint8Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteArray[i] = byteCharacters.charCodeAt(i);
                }
                
                const blob = new Blob([byteArray], { type: mimeType });
                compiledBlobUrl = URL.createObjectURL(blob);
                
                // 3. Create Fallback Data URI (Direct base64 link)
                fallbackDataUri = `data:${mimeType};base64,${finalB64}`;
                
                document.getElementById('scan-status').innerText = "Transfer Complete! Choose an option:";
                document.getElementById('downloadBtn').style.display = 'block';
                document.getElementById('fallbackBtn').style.display = 'block';
                
            } catch (err) {
                alert("Error decoding file: " + err.message);
            }
        }

        function triggerDownload() {
            if (compiledBlobUrl) {
                const link = document.createElement('a');
                link.href = compiledBlobUrl;
                link.download = scanFileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        function triggerFallbackDownload() {
            if (fallbackDataUri) {
                const link = document.createElement('a');
                link.href = fallbackDataUri;
                link.download = scanFileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        // --- SENDER LOGIC ---
        let genInterval;
        let qrObj = null;

        function startGenerating() {
            const fileInput = document.getElementById('fileInput').files[0];
            const fps = parseInt(document.getElementById('fpsInput').value) || 15;
            if (!fileInput) return alert("Select a file first.");
            
            const reader = new FileReader();
            document.getElementById('gen-status').innerText = "Processing file...";
            
            reader.onload = function(e) {
                const b64Full = e.target.result.split(',')[1];
                const chunkSize = 500;
                const chunks = [];
                
                for (let i = 0; i < b64Full.length; i += chunkSize) {
                    let chunk = b64Full.substring(i, i + chunkSize);
                    if (chunk.length < chunkSize) {
                        chunk = chunk.padEnd(chunkSize, ' ');
                    }
                    chunks.push(chunk);
                }
                
                const qrDisp = document.getElementById('qr-display');
                qrDisp.innerHTML = "";
                qrDisp.style.display = 'block';
                qrObj = new QRCode(qrDisp, { width: 280, height: 280, correctLevel: QRCode.CorrectLevel.L });
                
                let currentIndex = 0;
                document.getElementById('startGenBtn').innerText = "Stop Broadcast";
                document.getElementById('startGenBtn').onclick = stopGenerating;

                clearInterval(genInterval);
                genInterval = setInterval(() => {
                    let payload = `${fileInput.name}|${chunks.length}|${currentIndex}|${chunks[currentIndex]}`;
                    qrObj.clear();
                    qrObj.makeCode(payload);
                    document.getElementById('gen-status').innerText = `Broadcasting: Frame ${currentIndex + 1}/${chunks.length}`;
                    currentIndex = (currentIndex + 1) % chunks.length;
                }, 1000 / fps);
            };
            reader.readAsDataURL(fileInput);
        }

        function stopGenerating() {
            clearInterval(genInterval);
            document.getElementById('qr-display').style.display = 'none';
            document.getElementById('gen-status').innerText = "Broadcast stopped.";
            document.getElementById('startGenBtn').innerText = "Start Broadcast";
            document.getElementById('startGenBtn').onclick = startGenerating;
        }
    </script>
</body>
</html>
